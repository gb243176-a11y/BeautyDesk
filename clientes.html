<!DOCTYPE html>

<div class="sidebar">

<h2>BeautyDesk</h2>


<ul>

<li>

</li>


<li>

<li class="active">
👥 Clientes
</li>


<li>Sair</li>


</ul>

</div>




<div class="main">


<header>

<h1>Clientes</h1>

</header>




<section class="box">


<h2>Novo Cliente</h2>


<form id="clienteForm">


<input
type="text"
id="nome"
placeholder="Nome do cliente"
required>


<input
type="tel"
id="telefone"
placeholder="Telefone">


<input
type="email"
id="email"
placeholder="E-mail">



<button type="submit">

Cadastrar Cliente

</button>


</form>


</section>




<section class="box">


<h2>Lista de Clientes</h2>



<table>


<thead>

<tr>

<th>Nome</th>

<th>Telefone</th>

<th>E-mail</th>

</tr>

</thead>


<tbody id="listaClientes">


</tbody>


</table>



</section>



</div>




<script src="js/clientes.js"></script>


</body>


</html>
