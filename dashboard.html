<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | BeautyDesk</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <h2>BeautyDesk</h2>

    <ul>

        <li class="active">📊 Dashboard</li>

        <li>
            <a href="agenda.html">📅 Agenda</a>
        </li>

        <li>
            <a href="clientes.html">👥 Clientes</a>
        </li>

        <li>Sair</li>

    </ul>

</div>


<div class="main">

    <header>

        <h1>Dashboard</h1>

        <div class="user">
            Administrador
        </div>

    </header>


    <section class="cards">


        <div class="card">

            <h3>Clientes</h3>

            <strong id="totalClientes">
                0
            </strong>

        </div>


        <div class="card">

            <h3>Agendamentos</h3>

            <strong>
                0
            </strong>

        </div>


        <div class="card">

            <h3>Faturamento</h3>

            <strong>
                R$ 0
            </strong>

        </div>


    </section>


    <section class="resumo">

        <h2>

            Próximos agendamentos

        </h2>


        <table>

            <thead>

                <tr>

                    <th>Cliente</th>

                    <th>Horário</th>

                    <th>Serviço</th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>Maria</td>

                    <td>09:00</td>

                    <td>Corte</td>

                </tr>


            </tbody>

        </table>


    </section>


</div>


<script src="js/dashboard.js"></script>
