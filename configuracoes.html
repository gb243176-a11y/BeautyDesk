<header>

<h1>
Configurações do Salão
</h1>


<p>
Personalize as informações do seu negócio.
</p>


</header>






<section class="config-box">



<form id="configForm">



<label>
Nome do salão
</label>


<input

type="text"

id="nomeSalao"

placeholder="Digite o nome do salão"

>



<label>
Telefone
</label>


<input

type="text"

id="telefoneSalao"

placeholder="Digite o telefone"

>



<label>
E-mail
</label>


<input

type="email"

id="emailSalao"

placeholder="Digite o e-mail"

>




<div class="opcao">


<label>

<input

type="checkbox"

id="notificacoes"

>

Receber notificações

</label>


</div>





<button type="submit">

Salvar configurações

</button>



</form>



</section>




</div>
