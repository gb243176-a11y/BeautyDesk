<div class="main">


<header>

<h1>Serviços</h1>

</header>




<section class="box">


<h2>Cadastrar Serviço</h2>


<form id="servicoForm">


<input

type="text"

id="nomeServico"

placeholder="Nome do serviço"

required

>



<input

type="number"

id="valorServico"

placeholder="Valor (R$)"

step="0.01"

required

>



<input

type="number"

id="duracaoServico"

placeholder="Duração (minutos)"

required

>



<button type="submit">

Salvar Serviço

</button>


</form>


</section>




<section class="box">


<h2>Serviços Cadastrados</h2>



<table>


<thead>

<tr>

<th>Serviço</th>

<th>Valor</th>

<th>Duração</th>

</tr>

</thead>


<tbody id="listaServicos">


</tbody>


</table>


</section>



</div>
